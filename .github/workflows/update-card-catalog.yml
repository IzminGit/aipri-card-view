name: Update card catalog

on:
  push:
    branches:
      - agent/update-card-catalog-20260731
    paths:
      - .github/workflows/update-card-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/update-card-catalog-20260731
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-cards.mjs
      - name: Commit updated catalog
        run: |
          if git diff --quiet -- cards.json; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json
          git commit -m "Update card catalog for 2026-07-31"
          git push origin HEAD:agent/update-card-catalog-20260731
